<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Courier New',Consolas,'Liberation Mono',monospace}
.t{font-size:66px;font-weight:900;letter-spacing:12px;text-anchor:middle;transform-box:fill-box;transform-origin:center}
.l1{fill:#8f8f8f;animation:g1 3.2s infinite}
.l2{fill:#e6e6e6;opacity:.45;animation:g2 3.2s infinite}
.l0{fill:#fff;animation:g0 3.2s infinite}
.sb{font-size:13px;letter-spacing:5px;fill:#8a8a8a;text-anchor:middle}
.bar{fill:#fff;animation:br 3.2s infinite}
.pill{font-size:11px;font-weight:700;letter-spacing:2px;fill:#fff}
.pt1{font-size:18px;font-weight:900;letter-spacing:3px;fill:#fff}
.pt2{font-size:12px;letter-spacing:1px;fill:#a8a8a8}
.bl{font-size:11px;fill:#d0d0d0}
.pop{animation:pp .9s ease-out both}
.gw{animation:gw 2.8s ease-in-out infinite}
.flow{animation:fw 1.2s linear infinite}
.mv{animation:mv 6s linear infinite}
.bk{animation:bk 1s steps(2,end) infinite}
@keyframes g1{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-8px,1px)}92%{transform:translate(6px,-2px)}94%{transform:translate(-4px,2px)}96%{transform:translate(0,0)}}
@keyframes g2{0%,89%,100%{transform:translate(0,0)}91%{transform:translate(8px,-1px)}93%{transform:translate(-6px,2px)}95%{transform:translate(4px,0)}97%{transform:translate(0,0)}}
@keyframes g0{0%,90%,100%{transform:skewX(0)}92%{transform:skewX(-10deg)}94%{transform:skewX(8deg)}96%{transform:skewX(0)}}
@keyframes br{0%,80%,100%{opacity:0}84%{opacity:.85}88%{opacity:0}92%{opacity:.6}96%{opacity:0}}
@keyframes pp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes gw{0%,100%{stroke-opacity:.05}50%{stroke-opacity:.7}}
@keyframes fw{to{stroke-dashoffset:-12}}
@keyframes mv{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(660px);opacity:0}}
@keyframes bk{0%{opacity:1}50%{opacity:0}}
</style>
