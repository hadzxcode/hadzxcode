<svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg" width="400" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="black" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#4a4a52"/>
      <stop offset="45%" stop-color="#1c1c21"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="red" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#b5b5b5"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14141a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .float { animation: float 3s ease-in-out infinite; }
    .tail  { animation: wag 2s ease-in-out infinite; transform-origin: 262px 300px; }
    .eyes  { animation: blink 4s infinite; transform-origin: 200px 170px; }
    .glow  { animation: pulse 1.8s ease-in-out infinite; }
    .sh    { animation: shrink 3s ease-in-out infinite; transform-origin: 200px 392px; }
    .code  { font-family: monospace; font-size: 20px; fill: #ffffff; animation: fade 3s ease-in-out infinite; }
    .c2 { animation-delay: 1s; fill: #8a8a8a; }
    .c3 { animation-delay: 2s; }
    @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shrink { 0%,100% { transform: scale(1); } 50% { transform: scale(0.85); } }
    @keyframes wag    { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
    @keyframes blink  { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes pulse  { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
    @keyframes fade   { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
  </style>

  <circle cx="200" cy="215" r="185" fill="url(#bgGlow)" class="glow"/>

  <text x="38"  y="120" class="code">&lt;/&gt;</text>
  <text x="322" y="90"  class="code c2">{ }</text>
  <text x="335" y="255" class="code c3">01</text>
  <text x="28"  y="275" class="code c2">#!</text>

  <!-- floor shadow -->
  <ellipse cx="200" cy="392" rx="95" ry="14" fill="url(#shadow)" class="sh"/>

  <g class="float">
    <!-- tail -->
    <g class="tail">
      <path d="M 262 310 C 345 310 380 240 348 175 C 333 228 305 255 258 265 Z" fill="url(#red)"/>
      <path d="M 348 175 C 362 202 362 230 349 250 C 340 228 337 202 348 175 Z" fill="url(#black)"/>
      <path d="M 275 295 C 320 290 345 255 345 215" stroke="#fff" stroke-opacity="0.25" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- body -->
    <ellipse cx="200" cy="300" rx="64" ry="70" fill="url(#black)"/>
    <path d="M 138 295 C 138 335 158 360 176 366 L 150 345 Z" fill="url(#red)"/>
    <path d="M 262 295 C 262 335 242 360 224 366 L 250 345 Z" fill="url(#red)"/>
    <ellipse cx="178" cy="275" rx="20" ry="30" fill="url(#gloss)"/>

    <!-- feet -->
    <ellipse cx="170" cy="368" rx="26" ry="14" fill="url(#black)"/>
    <ellipse cx="230" cy="368" rx="26" ry="14" fill="url(#black)"/>
    <ellipse cx="162" cy="362" rx="10" ry="4" fill="#fff" opacity="0.25"/>
    <ellipse cx="222" cy="362" rx="10" ry="4" fill="#fff" opacity="0.25"/>

    <!-- laptop -->
    <rect x="150" y="290" width="100" height="64" rx="8" fill="#0a0a0d" stroke="#ffffff" stroke-width="3"/>
    <path d="M 183 332 L 194 310 L 205 326 L 217 312" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#neon)" class="glow"/>
    <rect x="150" y="290" width="100" height="22" rx="8" fill="url(#gloss)" opacity="0.5"/>

    <!-- arms -->
    <ellipse cx="144" cy="322" rx="15" ry="21" fill="url(#black)" stroke="#b5b5b5" stroke-width="3"/>
    <ellipse cx="256" cy="322" rx="15" ry="21" fill="url(#black)" stroke="#b5b5b5" stroke-width="3"/>

    <!-- ears -->
    <path d="M 103 145 L 116 42 L 192 102 Z" fill="url(#red)"/>
    <path d="M 297 145 L 284 42 L 208 102 Z" fill="url(#red)"/>
    <path d="M 121 108 L 127 66 L 166 98 Z" fill="url(#black)"/>
    <path d="M 279 108 L 273 66 L 234 98 Z" fill="url(#black)"/>
    <path d="M 128 100 L 131 80 L 150 94 Z" fill="#ffffff" opacity="0.7"/>
    <path d="M 272 100 L 269 80 L 250 94 Z" fill="#ffffff" opacity="0.7"/>

    <!-- hood -->
    <ellipse cx="200" cy="168" rx="100" ry="90" fill="url(#black)" stroke="url(#red)" stroke-width="9"/>
    <path d="M 125 110 C 150 70 220 62 262 90" stroke="#fff" stroke-opacity="0.35" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- visor -->
    <rect x="116" y="112" width="168" height="104" rx="50" fill="url(#visor)"/>
    <rect x="116" y="112" width="168" height="104" rx="50" fill="none" stroke="#ffffff" stroke-width="2.5" class="glow"/>
    <path d="M 140 128 C 170 116 230 116 262 130 C 230 134 170 134 140 128 Z" fill="url(#gloss)"/>

    <!-- eyes -->
    <g class="eyes" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" filter="url(#neon)">
      <path d="M 146 176 Q 164 150 182 176" class="glow"/>
      <path d="M 218 176 Q 236 150 254 176" class="glow"/>
    </g>
    <path d="M 191 194 Q 200 203 209 194" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#neon)"/>

    <!-- nose + whiskers -->
    <ellipse cx="200" cy="104" rx="9" ry="6" fill="#ffffff"/>
    <g stroke="#b5b5b5" stroke-width="3" stroke-linecap="round">
      <line x1="108" y1="165" x2="76" y2="154"/>
      <line x1="108" y1="180" x2="74" y2="184"/>
      <line x1="292" y1="165" x2="324" y2="154"/>
      <line x1="292" y1="180" x2="326" y2="184"/>
    </g>

    <!-- strings + tag -->
    <line x1="170" y1="255" x2="168" y2="278" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="230" y1="255" x2="232" y2="278" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="186" y="248" width="28" height="20" rx="5" fill="url(#red)" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M 192 260 L 200 252 L 208 260" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
