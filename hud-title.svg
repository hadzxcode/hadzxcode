<style>
text{font-family:'Courier New',Consolas,'Liberation Mono',monospace}
.t{font-size:42px;font-weight:900;letter-spacing:5px;text-anchor:middle;transform-box:fill-box;transform-origin:center}
.l1{fill:#8f8f8f;animation:g1 3.2s infinite}
.l2{fill:#e6e6e6;opacity:.45;animation:g2 3.2s infinite}
.l0{fill:#fff;animation:g0 3.2s infinite}
.s{font-size:12px;letter-spacing:3px;fill:#8a8a8a}
.sub{font-size:14px;letter-spacing:5px;fill:#bdbdbd;text-anchor:middle}
