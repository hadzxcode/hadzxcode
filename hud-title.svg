.dash{stroke:#fff;stroke-width:1;stroke-dasharray:6 6;opacity:.5;animation:dm 1.2s linear infinite}
@keyframes g1{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-6px,1px)}92%{transform:translate(5px,-2px)}94%{transform:translate(-3px,2px)}96%{transform:translate(0,0)}}
@keyframes g2{0%,89%,100%{transform:translate(0,0)}91%{transform:translate(6px,-1px)}93%{transform:translate(-5px,2px)}95%{transform:translate(3px,0)}97%{transform:translate(0,0)}}
@keyframes g0{0%,90%,100%{transform:skewX(0)}92%{transform:skewX(-10deg)}94%{transform:skewX(8deg)}96%{transform:skewX(0)}}
@keyframes bk{0%{opacity:1}50%{opacity:0}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes sc{0%{transform:translateY(-4px)}100%{transform:translateY(204px)}}
@keyframes dm{to{stroke-dashoffset:-24}}
</style>
