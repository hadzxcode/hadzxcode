<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Courier New',Consolas,'Liberation Mono',monospace}
text{font-size:14px;fill:#a8a8a8;xml:space:preserve;white-space:pre}
.cmd{fill:#fff;font-weight:700}
.ok{fill:#fff;font-weight:700}
.dim{fill:#a8a8a8}
.ln{animation:sh 9s infinite both}
.bar{transform-box:fill-box;transform-origin:left;animation:pb 9s infinite both;animation-delay:3.5s}
.cur{animation:bk 1s steps(2,end) infinite}
.tb{font-size:12px;fill:#8a8a8a;text-anchor:middle}
@keyframes sh{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}
@keyframes pb{0%{transform:scaleX(0)}40%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes bk{0%{opacity:1}50%{opacity:0}}
</style>
<rect x="0.5" y="0.5" width="899" height="259" rx="10" fill="#05070a" stroke="#fff" stroke-opacity=".25"/>
<path d="M0.5 11A10 10 0 0 1 10.5 0.5H889.5A10 10 0 0 1 899.5 11V30H0.5Z" fill="#111"/>
<circle cx="22" cy="15" r="5" fill="#5a5a5a"/><circle cx="40" cy="15" r="5" fill="#8a8a8a"/><circle cx="58" cy="15" r="5" fill="#cfcfcf"/>
