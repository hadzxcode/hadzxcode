<style>
text{font-family:'Courier New',Consolas,'Liberation Mono',monospace}
.tag{font-size:11px;letter-spacing:2px;fill:#8a8a8a}
.nm{font-size:22px;font-weight:900;letter-spacing:3px;fill:#fff}
.rl{font-size:12px;letter-spacing:1px;fill:#a8a8a8}
.q{font-size:56px;font-weight:900;fill:#fff;animation:fl 2.2s infinite}
.card{animation:cp 3s ease-in-out infinite}
.scan{animation:sn 3.4s linear infinite}
.flow{animation:fw 1s linear infinite}
.bk{animation:bk 1s steps(2,end) infinite}
.eye{animation:ey 4s infinite;transform-box:fill-box;transform-origin:center}
.pt{animation:pu 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ring{animation:rg 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.cap{font-size:11px;letter-spacing:4px;fill:#9a9a9a;text-anchor:middle}
@keyframes cp{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
@keyframes sn{0%{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}100%{transform:translateY(205px);opacity:0}}
@keyframes fw{to{stroke-dashoffset:-16}}
@keyframes bk{0%{opacity:1}50%{opacity:0}}
@keyframes ey{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fl{0%,100%{opacity:.9}45%{opacity:.9}50%{opacity:.2}55%{opacity:.9}70%{opacity:.4}75%{opacity:.9}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes rg{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.2);opacity:0}}
</style>
